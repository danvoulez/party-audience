name: Contrato com o provedor de mídia

# Roda contra a API real do RealtimeKit, sem mock.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  contrato:
    name: Chamada real ao provedor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Exigir credenciais
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALTIMEKIT_APP_ID: ${{ secrets.REALTIMEKIT_APP_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$REALTIMEKIT_APP_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Contrato real
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALTIMEKIT_APP_ID: ${{ secrets.REALTIMEKIT_APP_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RTK_PRESET_HOST: ${{ vars.RTK_PRESET_HOST }}
          RTK_PRESET_PARTICIPANT: ${{ vars.RTK_PRESET_PARTICIPANT }}
          RTK_PRESET_LIVESTREAM_HOST: ${{ vars.RTK_PRESET_LIVESTREAM_HOST }}
          RTK_PRESET_VIEWER: ${{ vars.RTK_PRESET_VIEWER }}
        run: npm run test:media
