name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Piso de regressão: o que o código faz hoje não pode piorar.
  verify:
    name: Verificação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários e de integração
        run: npm test

      - name: Navegador para e2e
        run: npx playwright install --with-deps chromium

      - name: Testes end-to-end
        run: npx playwright test

  # A migration precisa aplicar limpa num banco vazio, sempre. Se ela e as
  # queries divergirem, os testes de sessão quebram aqui — não em produção.
  migracao:
    name: Migration em banco limpo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Aplicar migration e exercitar o schema
        run: npx vitest run test/integration/sessions.test.ts
